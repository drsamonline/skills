<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found — skills</title>
<meta name="description" content="That page does not exist on the skills knowledge base.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#0e0b16">
<meta name="color-scheme" content="dark">
<link rel="canonical" href="https://drsamonline.github.io/skills/">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230e0b16'/%3E%3Cpath d='M9 8h6v16H9zM17 8h6v10h-6z' fill='%238b5cf6'/%3E%3Ccircle cx='20' cy='23' r='3' fill='%2322d3ee'/%3E%3C/svg%3E">
<style>
  :root{
    --bg:#0e0b16; --panel:#171326; --line:#2c2540; --line2:#3a3157;
    --ink:#ece9f5; --dim:#a49fc0; --dim2:#7d7799; --violet:#8b5cf6; --cyan:#22d3ee;
    --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
    --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font:16px/1.65 var(--sans);-webkit-font-smoothing:antialiased;
    background-image:radial-gradient(820px 480px at 50% -12%, rgba(139,92,246,.16), rgba(14,11,22,0) 66%);
    background-attachment:fixed}
  .box{max-width:620px;margin:0 auto;padding:44px 24px;text-align:center}
  .ic{width:66px;height:66px;margin:0 auto 22px;display:grid;place-items:center;border-radius:18px;
    background:var(--panel);border:1px solid var(--line2);color:var(--violet)}
  .ic svg{width:34px;height:34px}
  .code{font:700 13px/1 var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--cyan)}
  h1{font-size:clamp(26px,5vw,38px);letter-spacing:-.02em;margin:14px 0 10px}
  p{color:var(--dim);margin:0 0 26px}
  .cta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  a.btn{display:inline-flex;align-items:center;gap:9px;text-decoration:none;border-radius:11px;
    padding:12px 18px;font-weight:600;border:1px solid var(--line2);background:var(--panel);color:var(--ink)}
  a.btn.primary{background:linear-gradient(100deg,var(--violet),#6d43e8);border-color:transparent;color:#fff}
  a.btn svg{width:17px;height:17px}
</style>
</head>
<body>
  <div class="box">
    <div class="ic" aria-hidden="true">
      <svg viewBox="0 0 24 24"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M4 5.5A1.5 1.5 0 0 1 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5Zm16 0A1.5 1.5 0 0 0 18.5 4H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5Z"/><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" d="m9 14 6-6"/></svg>
    </div>
    <div class="code">Error 404</div>
    <h1>That page isn't in the catalogue</h1>
    <p>The skill or page you asked for does not exist here. Every skill lives under <code>skills/&lt;skill-id&gt;/SKILL.md</code>, and the index is <code>catalog.json</code>.</p>
    <div class="cta">
      <a class="btn primary" href="/skills/">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M19 12H6m0 0 5-5m-5 5 5 5"/></svg>
        Back to the catalogue
      </a>
      <a class="btn" href="https://github.com/drsamonline/skills" target="_blank" rel="noopener">Repository</a>
    </div>
  </div>
</body>
</html>
