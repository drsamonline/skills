name: normalize skills

# One-shot (re-runnable): rewrites every SKILL.md name to the spec slug and
# preserves the human title under metadata.title. Idempotent.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/normalize.py"

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/normalize.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add skills
          git commit -m "chore: normalise SKILL.md names to the Agent Skills spec [skip ci]"
          git push
