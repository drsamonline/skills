name: normalize skills

# One-shot (re-runnable): rewrites every SKILL.md name to the spec slug and
# preserves the human title under metadata.title. Idempotent.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/normalize.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # was @v7.0.1
      - run: python3 scripts/normalize.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add skills
          git commit -m "chore: normalise SKILL.md names to the Agent Skills spec [skip ci]"
          # F-97: a push that exited 0 is not proof the normalised names reached the
          # branch. commit-and-verify.sh is NOT used here on purpose: this step stages a
          # DIRECTORY (`git add skills`) and the script hashes regular files, so it would
          # skip it and then report that nothing was produced.
          #
          # The verdict compares the COMMIT TREE instead: if origin/main's tree is this
          # commit's tree, every normalised file is there.
          BR="${GITHUB_REF_NAME:-main}"
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$BR" --quiet
            git rebase "origin/$BR" --quiet || { git rebase --abort 2>/dev/null || echo "::notice::no rebase was in progress to abort"; sleep 4; continue; }
            if git push --quiet origin "HEAD:$BR"; then pushed=1; break; fi
            echo "::warning::push rejected on attempt $attempt - the branch moved again"
            sleep 4
          done
          if [ "$pushed" != 1 ]; then
            echo "::error::could not push after 4 attempts - another workflow keeps moving the branch"
            exit 1
          fi
          git fetch origin "$BR" --quiet
          want="$(git rev-parse 'HEAD^{tree}')"
          got="$(git rev-parse "origin/$BR^{tree}" 2>/dev/null || echo absent)"
          if [ "$want" = "$got" ]; then
            echo "VERIFIED: origin/$BR has this commit's tree - every normalised file landed"
            exit 0
          fi
          echo "::error::the branch tree does not match this commit (want $want, found $got)"
          echo "::error::the normalisation did not land"
          exit 1