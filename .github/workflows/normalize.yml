name: normalize skills

# One-shot (re-runnable): rewrites every SKILL.md name to the spec slug and
# preserves the human title under metadata.title. Idempotent.

on:
  workflow_dispatch: {}
  push:
    paths:
      - "scripts/normalize.py"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/normalize.py
      - name: Commit if changed
        run: |
          if git diff --quiet; then echo "no change"; exit 0; fi
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add skills
          git commit -m "chore: normalise SKILL.md names to the Agent Skills spec [skip ci]"
          # retry: a bare `git push` loses the race when anything else commits first
          BR="${GITHUB_REF_NAME:-main}"
          pushed=0
          for attempt in 1 2 3 4; do
            git fetch origin "$BR" --quiet
            git rebase "origin/$BR" --quiet || { git rebase --abort || true; sleep 4; continue; }
            if git push --quiet origin "HEAD:$BR"; then pushed=1; break; fi
            echo "::warning::push rejected on attempt $attempt - the branch moved again"
            sleep 4
          done
          [ "$pushed" = 1 ] || { echo "::error::could not push after 4 attempts - another workflow keeps moving the branch"; exit 1; }
