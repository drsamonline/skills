<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Minimal fontconfig that points at one font directory.
     Copy to ~/.config/fontconfig/fonts.conf and edit the <dir> line.
     Then:  export FONTCONFIG_FILE=~/.config/fontconfig/fonts.conf
            fc-cache -f -->
<fontconfig>
  <dir>~/.local/share/fonts</dir>
  <cachedir>~/.cache/fontconfig</cachedir>
</fontconfig>
